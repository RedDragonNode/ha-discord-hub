[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  "RUF001",  # deutsche Texte in Strings
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]
